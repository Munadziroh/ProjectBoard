<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooky Health Monitor 🎃</title>
    <!-- Font Halloween & Horror-Cute dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1625;        /* Deep Night Purple */
            --card-bg: #262035;       /* Haunted Mansion Card */
            --pumpkin-orange: #ff7b00; /* Bright Pumpkin Orange */
            --witch-purple: #9d4edd;   /* Magic Purple */
            --slime-green: #70e000;    /* Toxic Slime Green */
            --ghost-white: #f8f9fa;    /* Ghostly White */
            --blood-red: #d62828;      /* Dracula Red */
            --text-light: #f3e9dc;     /* Pale Bone Text */
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            max-width: 680px;
            margin: 25px auto;
            padding: 20px;
            /* Pattern Latar Belakang Labu & Kelelawar Transparan */
            background-image: radial-gradient(#9d4edd 1.5px, transparent 1.5px), radial-gradient(#ff7b00 1.5px, #1a1625 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .main-card {
            background-color: var(--card-bg);
            padding: 28px;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(255, 123, 0, 0.25);
            border: 3px solid var(--pumpkin-orange);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        h2.title {
            font-family: 'Creepster', cursive;
            margin: 0;
            color: var(--pumpkin-orange);
            font-size: 34px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* Styling Tombol Tema Halloween */
        button {
            font-family: 'Fredoka', cursive;
            font-size: 14px;
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 123, 0, 0.4);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-ble {
            background-color: var(--witch-purple);
            color: var(--ghost-white);
        }

        .btn-sim {
            background-color: var(--slime-green);
            color: #1a1625;
        }

        .btn-save {
            background-color: var(--pumpkin-orange);
            color: #1a1625;
            padding: 10px 22px;
            font-size: 15px;
        }

        .btn-download {
            background-color: var(--blood-red);
            color: var(--ghost-white);
            padding: 12px 24px;
            font-size: 15px;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 700;
            color: #b8c0c8;
            background: #191424;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid var(--witch-purple);
        }

        /* Form Inputs Spooky */
        .form-group {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 150px;
            font-weight: 800;
            color: var(--slime-green);
            font-size: 16px;
        }

        .form-group input {
            font-family: 'Nunito', sans-serif;
            padding: 11px 16px;
            font-size: 15px;
            border: 2px solid var(--witch-purple);
            border-radius: 16px;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            background-color: #1a1625;
            color: var(--text-light);
            font-weight: 700;
        }

        .form-group input:focus {
            border-color: var(--pumpkin-orange);
            box-shadow: 0 0 10px rgba(255, 123, 0, 0.4);
        }

        .temp-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Styling Tabel Halloween */
        .table-container {
            margin-top: 25px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--pumpkin-orange);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1f1a2b;
        }

        th {
            background-color: var(--pumpkin-orange);
            color: #1a1625;
            font-family: 'Fredoka', cursive;
            padding: 14px;
            font-size: 16px;
            text-align: center;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #362e48;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-light);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .download-container {
            margin-top: 22px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header">
            <h2 class="title">🎃 Spooky Health</h2>
            <div class="btn-group">
                <button id="btnConnect" class="btn-ble" onclick="connectBLE()">🦇 Connect BLE</button>
                <button class="btn-sim" onclick="toggleSimulation()">🎲 Mode Acak</button>
            </div>
        </div>
        
        <div id="status" class="status-badge">Status: Belum Terhubung 👻</div>

        <div class="form-group">
            <label for="inputNama">🧙‍♂️ Nama:</label>
            <input type="text" id="inputNama" placeholder="Ketik nama korbanku...">
        </div>

        <div class="form-group">
            <label for="inputHR">💓 Heart Rate:</label>
            <input type="text" id="inputHR" readonly placeholder="Menunggu detak jantung...">
        </div>

        <div class="form-group temp-row">
            <label for="inputTemp">🌡️ Suhu Body:</label>
            <input type="text" id="inputTemp" readonly placeholder="Menunggu suhu...">
            <button class="btn-save" onclick="saveData()">🔮 Save</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Nama</th>
                        <th>H.R (bpm)</th>
                        <th>Temperature (°C)</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data tersimpan akan muncul di sini -->
                </tbody>
            </table>
        </div>

        <div class="download-container">
            <button class="btn-download" onclick="downloadCSV()">⚰️ Download Data (CSV)</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fa8c0d0-a5a3-11e9-a2a3-2a2ae2dbcce4";
        const CHARACTERISTIC_UUID = "9a48ecba-a5a3-11e9-a2a3-2a2ae2dbcce4";

        let savedRecords = [];
        let simInterval = null;

        // Mode Simulasi Data Acak
        function toggleSimulation() {
            const statusDiv = document.getElementById('status');
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                statusDiv.innerText = "Status: Ritual Acak Dimatikan 🪦";
                statusDiv.style.color = "#b8c0c8";
            } else {
                statusDiv.innerText = "Status: Ritual Acak Aktif (Simulasi) 🎃";
                statusDiv.style.color = "#ff7b00";
                simInterval = setInterval(() => {
                    const randomHR = (Math.random() * (100 - 65) + 65).toFixed(1);
                    const randomTemp = (Math.random() * (37.5 - 36.1) + 36.1).toFixed(1);
                    
                    document.getElementById('inputHR').value = randomHR + " bpm";
                    document.getElementById('inputTemp').value = randomTemp + " °C";
                }, 1000);
            }
        }

        // Koneksi Web Bluetooth Real-time
        async function connectBLE() {
            if (simInterval) toggleSimulation();
            
            const statusDiv = document.getElementById('status');
            try {
                statusDiv.innerText = "Status: Mencari ESP32... 🦇";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_Health_Monitor' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.innerText = "Status: Menghubungkan ke " + device.name + "... ⏳";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleBLEData);

                statusDiv.innerText = "Status: Terhubung ke ESP32! 🎉";
                statusDiv.style.color = "#70e000";
                document.getElementById('btnConnect').style.backgroundColor = '#70e000';
                document.getElementById('btnConnect').style.color = '#1a1625';

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Status Error: " + error.message + " ❌";
                statusDiv.style.color = "#d62828";
            }
        }

        function handleBLEData(event) {
            const value = new TextDecoder().decode(event.target.value);
            const data = value.split(',');
            if (data.length === 2) {
                document.getElementById('inputHR').value = data[0] + " bpm";
                document.getElementById('inputTemp').value = data[1] + " °C";
            }
        }

        // Menyimpan data ke tabel
        function saveData() {
            const nama = document.getElementById('inputNama').value.trim();
            const hr = document.getElementById('inputHR').value;
            const temp = document.getElementById('inputTemp').value;
            const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            if (!nama) {
                alert("Isi nama kamu dulu ya! 🧙‍♂️");
                return;
            }
            if (!hr || !temp || hr.includes("Menunggu")) {
                alert("Data HR & Temperature belum ada. Tekan 'Mode Acak' untuk tes! 🎲");
                return;
            }

            const record = { waktu: jam, nama, hr, temp };
            savedRecords.push(record);

            const tbody = document.getElementById('dataTableBody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${jam}</td>
                <td>${nama}</td>
                <td>${hr}</td>
                <td>${temp}</td>
            `;
            tbody.appendChild(row);
        }

        // Mengunduh data ke file CSV
        function downloadCSV() {
            if (savedRecords.length === 0) {
                alert("Belum ada data tersimpan di peti mati ini! ⚰️");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Waktu,Nama,HR (bpm),Temperature (C)\n";
            savedRecords.forEach(r => {
                csvContent += `"${r.waktu}","${r.nama}","${r.hr}","${r.temp}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "data_spooky_halloween.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
